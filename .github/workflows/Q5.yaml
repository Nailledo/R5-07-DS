name: Q5
on:
  push:
    paths: [ "Q5.java" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Jonathan LECLERC" > Q5_archive_$(date +%d-%m-%Y).txt
          cat Q5.java >> Q5_archive_$(date +%d-%m-%Y).txt
          git config user.name "Jonathan LECLERC"
          git config user.email "jonathan.leclerc@etu.univ-lehavre.fr"
          git add Q5_archive_*.txt
          git commit -m "Q5 archive"
          git push