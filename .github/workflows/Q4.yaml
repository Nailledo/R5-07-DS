name: Q4
on:
  push:
    paths: [ "Q4.java" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Jonathan LECLERC" > Q4_archive_$(date +%d-%m-%Y).txt
          cat Q4.java >> Q4_archive_$(date +%d-%m-%Y).txt
          git config user.name "Jonathan LECLERC"
          git config user.email "jonathan.leclerc@etu.univ-lehavre.fr"
          git add Q4_archive_*.txt
          git commit -m "Q4 archive"
          git push