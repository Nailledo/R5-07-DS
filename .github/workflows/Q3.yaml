name: Q3
on:
  push:
    paths: [ "Q3.java" ]
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Jonathan LECLERC" > Q3_archive_java.txt
          cat Q3.java >> Q3_archive_java.txt
          git config user.name "Jonathan LECLERC"
          git config user.email "jonathan.leclerc@etu.univ-lehavre.fr"
          git add Q3_archive_java.txt
          git commit -m "Q3 archive"
          git push