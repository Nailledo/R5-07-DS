name: Q3
on:
  push:
    paths: [ "Q3.java", ".github/workflows/Q3.yaml" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer Q3_archive_java.txt
        run: |
          {
            echo "Nom Prénom : LECLERC Jonathan"
            echo "----- Q3.java -----"
            cat Q3.java
          } > Q3_archive_java.txt
      - name: Pousser
        run: |
          git config user.name "LECLERC Jonathan"
          git config user.email "jonathan.leclerc@etu.univ-lehavre.fr"
          git add Q3_archive_java.txt
          git commit -m "Q3 : archive Q3.java" || exit 0
          git pull --rebase
          git push
