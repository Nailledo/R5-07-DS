name: Q1
on:
  push:
    paths: [ "XYZ.txt", ".github/workflows/Q1.yaml" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copier XYZ.txt
        run: cp XYZ.txt Q1_archive_XYZ.txt
      - name: Pousser
        run: |
          git config user.name "Jonathan LECLERC"
          git config user.email "jonathan.leclerc@etu.univ-lehavre.fr"
          git add Q1_archive_XYZ.txt
          git commit -m "Q1 : archive XYZ.txt" || exit 0
          git pull --rebase
          git push
